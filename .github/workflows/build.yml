name: Build E-Nagorik

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile backend
        working-directory: e-nagorik-backend
        run: |
          mkdir -p out
          javac -d out $(find src -name '*.java')

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-nagorik-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e-nagorik-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
